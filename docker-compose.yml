services:
  postgres_db:
    image: postgres:18
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      
    ports:
      - 5433:5432

    volumes:
      - postgres_data:/var/lib/postgresql
    
    networks:
      - habbit-quest

    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 5

  # backend:
  #   build: ./backend
  #   networks:
  #     - habbit-quest

volumes:
  postgres_data:

networks:
  habbit-quest:
